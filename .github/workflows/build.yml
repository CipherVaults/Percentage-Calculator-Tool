name: Build & Verify (Tauri v2)

on:
  push:
    branches: ["main", "v2.1-features"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-checks:
    name: Rust Core Tests & Web Asset Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run percent-core unit + 10k golden parity tests
        run: cargo test -p percent-core --locked -- --nocapture
      - name: Clippy on percent-core
        run: cargo clippy -p percent-core --all-targets --locked -- -D warnings
      - name: Verify mobile/index.html 10k parity, CSP hashes & UI/mobile DOM hygiene
        run: |
          node -e '
            const fs = require("fs");
            const path = require("path");
            const vm = require("vm");
            const crypto = require("crypto");
            const assert = require("assert");

            const lfFiles = [
              ...fs.readdirSync("mobile").filter(f => /\.(?:html|js|webmanifest)$/.test(f)).map(f => path.join("mobile", f)),
              ...fs.readdirSync("ui").filter(f => /\.(?:html|css|js)$/.test(f)).map(f => path.join("ui", f))
            ];
            assert(lfFiles.length >= 6, "Expected mobile and ui LF-enforced files");
            for (const f of lfFiles) {
              assert(!fs.readFileSync(f).includes(13), `CR byte detected in ${f}`);
            }

            const html = fs.readFileSync("mobile/index.html", "utf8");
            const styleMatch = html.match(/<style>([\s\S]*?)<\/style>/);
            const scriptMatch = html.match(/<script>([\s\S]*?)<\/script>/);
            assert(styleMatch && scriptMatch, "Missing <style> or <script> in mobile/index.html");

            const cspMatch = html.match(/<meta\s+http-equiv="Content-Security-Policy"\s+content="([^"]+)"/i);
            assert(cspMatch, "Missing CSP <meta> tag in mobile/index.html");
            const csp = cspMatch[1];

            const styleHash = crypto.createHash("sha256").update(styleMatch[1], "utf8").digest("base64");
            const scriptHash = crypto.createHash("sha256").update(scriptMatch[1], "utf8").digest("base64");
            const styleDir = csp.split(";").map(s => s.trim()).find(s => s.startsWith("style-src "));
            const scriptDir = csp.split(";").map(s => s.trim()).find(s => s.startsWith("script-src "));
            assert(styleDir && styleDir.includes(`'\''sha256-${styleHash}'\''`), `CSP style-src missing sha256-${styleHash}`);
            assert(scriptDir && scriptDir.includes(`'\''sha256-${scriptHash}'\''`), `CSP script-src missing sha256-${scriptHash}`);
            assert(!/frame-ancestors/i.test(csp), "CSP <meta> must not include frame-ancestors");

            const uiMain = fs.readFileSync("ui/main.js", "utf8");
            const swCode = fs.readFileSync("mobile/sw.js", "utf8");
            for (const src of [uiMain, scriptMatch[1], swCode]) {
              assert(!/\.innerHTML\b|\.outerHTML\b|\beval\s*\(|\bnew\s+Function\b/.test(src), "Forbidden DOM/eval sink detected");
            }
            assert(!/\.style\s*(?:\.|\[|=)/.test(scriptMatch[1]), "Mobile runtime style mutation detected");

            const manifest = JSON.parse(fs.readFileSync("mobile/manifest.webmanifest", "utf8"));
            for (const k of ["name", "short_name", "start_url"]) {
              assert(typeof manifest[k] === "string" && manifest[k].trim().length > 0, `Missing manifest field: ${k}`);
            }
            assert(Array.isArray(manifest.icons) && manifest.icons.length > 0, "Missing manifest icons");
            const mobileRoot = path.resolve("mobile");
            for (const icon of manifest.icons) {
              assert(typeof icon.src === "string" && icon.src.length > 0, "Manifest icon missing src");
              const rel = icon.src.replace(/^\.\//, "");
              const resolved = path.resolve(mobileRoot, rel);
              assert(resolved.startsWith(mobileRoot + path.sep), `Manifest icon escapes mobile/: ${icon.src}`);
              const stat = fs.statSync(resolved);
              assert(stat.isFile() && stat.size > 0, `Manifest icon missing or empty: ${icon.src}`);
            }

            const fnStart = scriptMatch[1].indexOf("function formatDecimal");
            const fnEnd = scriptMatch[1].indexOf("// --- Persistent on-device history");
            assert(fnStart !== -1 && fnEnd > fnStart, "Could not locate math engine boundaries");
            const ctx = { Number, Math };
            vm.runInNewContext(scriptMatch[1].slice(fnStart, fnEnd), ctx);
            const parseNum = (s) => (s === "NaN" ? NaN : s === "Infinity" ? Infinity : s === "-Infinity" ? -Infinity : Number(s));
            const cases = JSON.parse(fs.readFileSync("crates/percent-core/tests/fixtures/golden.json", "utf8"));
            for (const c of cases) {
              if (c.f === "formatDecimal") assert.strictEqual(ctx.formatDecimal(parseNum(c.a[0])), c.r);
              else if (c.f === "discount") {
                const act = ctx.calcDiscount(parseNum(c.a[0]), parseNum(c.a[1]));
                assert.strictEqual(act.label, c.r.label);
                assert.strictEqual(act.copyText, c.r.copyText);
              } else {
                const a = parseNum(c.a[0]), b = parseNum(c.a[1]);
                const act = c.f === "percentageChange" ? ctx.calcChange(a, b)
                  : c.f === "percentageOfTotal" ? ctx.calcPercentOfTotal(a, b)
                  : c.f === "percentagePortion" ? ctx.calcPortion(a, b)
                  : ctx.calcOriginal(a, b);
                if (c.r.ok) { assert.strictEqual(act.ok, "true"); assert.strictEqual(act.label, c.r.label); }
                else { assert.strictEqual(act.ok, "false"); assert.strictEqual(act.error, c.r.error); }
              }
            }

            const mmOk = ctx.calcMarkupMargin(80, 100);
            assert.strictEqual(mmOk.ok, "true");
            assert.strictEqual(mmOk.profitText, "20.00");
            assert.strictEqual(mmOk.markupText, "25.00%");
            assert.strictEqual(mmOk.marginText, "20.00%");
            assert.strictEqual(mmOk.liveResult, "Profit: 20.00 | Markup: 25.00% | Margin: 20.00%");
            assert.strictEqual(mmOk.copyText, "Profit: 20.00\nMarkup: 25.00%\nMargin: 20.00%");
            const mmNeg = ctx.calcMarkupMargin(100, 75);
            assert.strictEqual(mmNeg.profitText, "-25.00");
            assert.strictEqual(mmNeg.markupText, "-25.00%");
            assert.strictEqual(mmNeg.marginText, "-33.33%");
            assert.strictEqual(ctx.calcMarkupMargin(0, 100).error, "Cost cannot be zero");
            assert.strictEqual(ctx.calcMarkupMargin(100, 0).error, "Selling price cannot be zero");

            const taxAdd = ctx.calcTax(100, 15, "add");
            assert.strictEqual(taxAdd.ok, "true");
            assert.strictEqual(taxAdd.netText, "100.00");
            assert.strictEqual(taxAdd.taxText, "15.00");
            assert.strictEqual(taxAdd.totalText, "115.00");
            assert.strictEqual(taxAdd.liveResult, "Total: 115.00 | Tax: 15.00");
            assert.strictEqual(taxAdd.copyText, "Total: 115.00\nTax: 15.00\nNet: 100.00");
            const taxExt = ctx.calcTax(115, 15, "extract");
            assert.strictEqual(taxExt.ok, "true");
            assert.strictEqual(taxExt.netText, "100.00");
            assert.strictEqual(taxExt.taxText, "15.00");
            assert.strictEqual(taxExt.totalText, "115.00");
            assert.strictEqual(taxExt.liveResult, "Net: 100.00 | Tax: 15.00");
            assert.strictEqual(taxExt.copyText, "Net: 100.00\nTax: 15.00\nTotal: 115.00");
            const taxNegExt = ctx.calcTax(-100, 5, "extract");
            assert.strictEqual(taxNegExt.netText, "-95.24");
            assert.strictEqual(taxNegExt.taxText, "-4.76");
            assert.strictEqual(ctx.calcTax(100, -100, "extract").error, "Tax rate cannot be -100%");

            console.log(`Mobile HTML parity, markup/margin, tax, manifest, LF & CSP verified (${cases.length} golden cases).`);
          '
      - name: Run cross-surface safety & golden parity eval
        run: node scripts/safety-eval.mjs --json target/safety-eval-system-card.json
      - name: Upload Ubuntu safety eval system card
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: safety-eval-system-card-ubuntu
          path: target/safety-eval-system-card.json
          if-no-files-found: error

  windows-build:
    name: Windows Build, Smoke Test & Bundles
    needs: rust-checks
    runs-on: windows-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.stage.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: ". -> target"

      - name: Clippy on full workspace (Windows)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Run full workspace unit tests (Windows)
        run: cargo test --workspace --locked

      - name: Run cross-surface safety & golden parity eval
        run: node scripts/safety-eval.mjs --json target/safety-eval-system-card.json

      - name: Upload Windows safety eval system card
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: safety-eval-system-card-windows
          path: target/safety-eval-system-card.json
          if-no-files-found: error

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "=2.12.4" --locked

      - name: Build Windows installers (NSIS + MSI) and release binary
        run: cargo tauri build -- --locked

      - name: Run real Tauri window smoke test
        run: .\target\release\percentage-calculator-tool.exe --smoke-test

      - name: Stage clean deliverables & SHA256SUMS (Installer + Portable + Mobile HTML)
        id: stage
        shell: pwsh
        run: |
          $conf = Get-Content "src-tauri/tauri.conf.json" -Raw | ConvertFrom-Json
          $ver = $conf.version
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue dist
          New-Item -ItemType Directory -Force -Path dist/Installer, dist/Portable, dist/Mobile | Out-Null
          $nsis = Get-ChildItem -Path "target/release/bundle/nsis" -Filter "*${ver}*setup*.exe" -File
          $msi = Get-ChildItem -Path "target/release/bundle/msi" -Filter "*${ver}*.msi" -File
          if ($nsis.Count -ne 1 -or $msi.Count -ne 1) {
            throw "Expected exactly 1 NSIS setup and 1 MSI installer matching version $ver (got nsis=$($nsis.Count), msi=$($msi.Count))."
          }
          Copy-Item $nsis[0].FullName "dist/Installer/"
          Copy-Item $msi[0].FullName "dist/Installer/"
          Copy-Item "target/release/percentage-calculator-tool.exe" "dist/Portable/Percentage.Calculator.Tool.Portable.$ver.exe"
          Copy-Item "mobile/index.html" "dist/Mobile/Percentage.Calculator.Tool.Mobile.$ver.html"

          $files = Get-ChildItem -Path dist/Installer, dist/Portable, dist/Mobile -File | Sort-Object Name
          $lines = foreach ($f in $files) {
            $hash = (Get-FileHash -Path $f.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            $releaseAssetName = $f.Name.Replace(" ", ".")
            "$hash  $releaseAssetName"
          }
          Set-Content -Path "dist/SHA256SUMS.txt" -Value $lines -Encoding utf8NoBOM
          "version=$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8NoBOM
          Get-ChildItem -Recurse dist
          Get-Content dist/SHA256SUMS.txt

      - name: Upload Windows deliverables
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Percentage-Calculator-Tool-Windows-v${{ steps.stage.outputs.version }}
          path: dist/**
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [rust-checks, windows-build]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Download staged deliverables
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: Percentage-Calculator-Tool-Windows-v${{ needs.windows-build.outputs.version }}
          path: dist

      - name: Publish GitHub Release on main or version tag
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ needs.windows-build.outputs.version }}"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="$GITHUB_REF_NAME"
            if [[ "$TAG" != "v${VERSION}" ]]; then
              echo "Tag ${TAG} does not match app version v${VERSION}; aborting release." >&2
              exit 1
            fi
          else
            TAG="v${VERSION}"
          fi

          shopt -s nullglob
          ASSETS=(
            dist/Installer/*setup*.exe
            dist/Installer/*.msi
            dist/Portable/*.exe
            dist/Mobile/*.html
            dist/SHA256SUMS.txt
          )
          test "${#ASSETS[@]}" -eq 5

          NOTES_FILE=".github/release-notes-${TAG}.md"
          if gh release view "$TAG" >/dev/null 2>&1; then
            if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
              echo "Release $TAG already exists; refusing to overwrite or move an existing release tag." >&2
              exit 1
            fi
            echo "Release $TAG already exists; preserving immutable tag and assets. Bump version to publish a new release."
            exit 0
          fi

          if [[ -f "$NOTES_FILE" ]]; then
            gh release create "$TAG" "${ASSETS[@]}" \
              --target "$GITHUB_SHA" \
              --title "Percentage Calculator Tool Desktop $TAG (Tauri v2 + Rust)" \
              --notes-file "$NOTES_FILE"
          else
            gh release create "$TAG" "${ASSETS[@]}" \
              --target "$GITHUB_SHA" \
              --title "Percentage Calculator Tool Desktop $TAG (Tauri v2 + Rust)" \
              --generate-notes
          fi

