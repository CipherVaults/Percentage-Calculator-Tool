[package]
name = "percentage-calculator-tool"
version = "2.1.0"
edition = "2021"
description = "Offline desktop percentage calculator built with Tauri and Rust."
authors = ["Mohamed Sayed", "Ahmed Emara", "DeepSeek", "ChatGPT", "Antigravity"]
license = "UNLICENSED"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
percent-core = { path = "../crates/percent-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-clipboard-manager = "2"
